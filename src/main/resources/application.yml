spring:
  application:
    name: pally-backend
  mvc:
    # Throw NoHandlerFoundException for unmapped routes so GlobalExceptionHandler
    # returns a clean 404 envelope instead of falling through to a generic 500.
    throw-exception-if-no-handler-found: true
  web:
    resources:
      # Required for the above: the static-resource handler would otherwise
      # swallow unmapped requests and NoHandlerFoundException would never fire.
      # This is a JSON API — Spring serves no static assets.
      add-mappings: false
  # (compile.* tunables live at the root, below)
  servlet:
    multipart:
      # Uploads (PDF/image notes) can be large — a full book is ~20MB. Without
      # this, Spring's defaults (1MB file / 10MB request) reject anything big
      # DURING multipart parsing, before KnowledgeController's 25MB check ever
      # runs (→ a generic 500). Keep file-size aligned with MAX_UPLOAD_BYTES
      # (25MB); request-size is a little higher for multipart/form overhead.
      max-file-size: 25MB
      max-request-size: 30MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USER:pally}
    password: ${DB_PASSWORD:pally}
    hikari:
      # Env-driven so we can tune per environment without a redeploy. With
      # virtual threads on, the app accepts thousands of concurrent requests
      # but each DB call still borrows a real connection — so the pool is the
      # ceiling and tuning matters MORE, not less. 10s connection-timeout
      # fails fast instead of piling up callers for 30s; leak-detection at
      # 20s catches accidentally-held connections in dev.
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: ${DB_POOL_TIMEOUT:10000}
      keepalive-time: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: ${DB_LEAK_MS:20000}
      connection-test-query: SELECT 1
  jpa:
    # OSIV disabled: DB connections are only held during @Transactional methods,
    # never across the full HTTP request. Without this, a 60s Claude call holds
    # a Hikari connection → connection leak → pool exhaustion → quiz/compile hangs.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  threads:
    virtual:
      enabled: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:resend}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
    from: ${MAIL_FROM:noreply@apalchi.com}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}  # Railway injects PORT; local dev must set it explicitly
  shutdown: graceful

# ── App-level config ─────────────────────────────────────────────────────────
app:
  # Public web origin used to build tokenized review URLs sent to trusted adults.
  web-base-url: ${WEB_BASE_URL:https://apalchi.com}
  # Forced-update gate: the lowest client version the backend still supports. The
  # mobile app fetches these on launch and blocks below them. Defaults to 1.0.0
  # (no-op) — raise via env when a breaking backend change ships.
  min-version:
    ios: ${MIN_APP_VERSION_IOS:1.0.0}
    android: ${MIN_APP_VERSION_ANDROID:1.0.0}
  revenuecat:
    # Shared secret for the RevenueCat webhook — set this to the exact value you
    # enter in RevenueCat's Authorization-header field. Blank = endpoint rejects all.
    auth-secret: ${REVENUECAT_WEBHOOK_SECRET:}
  review:
    # 0–100 quality-score floor below which an INFERRED page is surfaced to the
    # client as LOW_CONFIDENCE. 60 ≈ bottom quartile of the verifier's heuristic
    # distribution (a clean page scores 100; one penalty drops it to ~70–90, so
    # 60 catches pages with multiple quality issues stacked up).
    low-confidence-threshold: ${REVIEW_LOW_CONF:60}

# ── Third-party AI consent gate ──────────────────────────────────────────────
# Now ALWAYS enforced (no flag). The plain-language disclosure naming Anthropic
# (Claude) and Google (Gemini) as overseas AI processors is shown in the UI
# BEFORE the user's first upload or chat; the client then POSTs
# /consent/ai-data-transfer to satisfy the gate. See ConsentGuard.requireAiConsent().

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false
  metrics:
    tags:
      application: pally-backend

# Resilience4j around Claude. Retry on 5xx/timeout/429, never on a
# non-429 4xx (those are caller errors). Breaker opens at 50% failure
# over 20 calls and waits 30s in half-open. Pally currently runs single
# instance — counters are per-instance.
resilience4j:
  retry:
    instances:
      claude:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2
        randomized-wait-factor: 0.5
        retry-exceptions:
          - java.util.concurrent.TimeoutException
          - org.springframework.web.reactive.function.client.WebClientResponseException$TooManyRequests
          - org.springframework.web.reactive.function.client.WebClientResponseException$InternalServerError
          - org.springframework.web.reactive.function.client.WebClientResponseException$BadGateway
          - org.springframework.web.reactive.function.client.WebClientResponseException$ServiceUnavailable
          - org.springframework.web.reactive.function.client.WebClientResponseException$GatewayTimeout
  circuitbreaker:
    instances:
      claude:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true

jwt:
  secret: ${JWT_SECRET:dev-secret-min-32-chars-long-here-!!}

# Social auth client IDs for audience validation (Google/Apple idTokens).
# Set GOOGLE_CLIENT_IDS and APPLE_CLIENT_IDS in Railway Variables.
# Comma-separated for multiple platforms (iOS / Android have different IDs).
auth:
  google:
    client-ids: ${GOOGLE_CLIENT_IDS:}
  apple:
    client-ids: ${APPLE_CLIENT_IDS:}

# Stripe — leave blank in dev so SubscriptionController stays in mock mode.
# Set STRIPE_SECRET_KEY + STRIPE_WEBHOOK_SECRET on Railway to flip to live.
# Register the webhook URL in the Stripe Dashboard as:
#   https://pallybackend-production.up.railway.app/api/v1/subscription/webhook
stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  # Mock webhook secret for QA/dev only. Set MOCK_WEBHOOK_SECRET in Railway for dev environments.
  # Leave blank in production to disable the mock path entirely.
  mock-webhook-secret: ${MOCK_WEBHOOK_SECRET:}
  return:
    success-url: ${STRIPE_SUCCESS_URL:pally://subscription/return?status=success}
    cancel-url: ${STRIPE_CANCEL_URL:pally://subscription/return?status=cancel}
  # Stripe Price IDs — CONSOLIDATED 2026-06-30 under ONE product prod_UdpRpXbhmTnDHa
  # ("Apalchi"), ALL in USD. Replaces the earlier split (consumer USD + centre SGD
  # on multiple products, with two DELETED family prices). Local currency at
  # checkout is handled by Stripe Adaptive Pricing (Dashboard → Payments), not here.
  # Set these in Railway Variables to override in prod; blank in dev = mock mode.
  price:
    # Legacy (kept for backward-compat if any existing subscribers use old keys)
    individual-monthly: ${STRIPE_PRICE_INDIVIDUAL_MONTHLY:}
    family-monthly: ${STRIPE_PRICE_FAMILY_MONTHLY:}
    # Consumer (B2C), USD:  Pro $9.99/mo $79/yr · Max $19.99/mo $159/yr · Family $34.99/mo $279/yr
    pro-monthly: ${STRIPE_PRICE_PRO_MONTHLY:price_1ToFSeE1t2gQ3tvLLOmEcWwn}
    pro-annual: ${STRIPE_PRICE_PRO_ANNUAL:price_1ToFSoE1t2gQ3tvL6juX5OhS}
    max-monthly: ${STRIPE_PRICE_MAX_MONTHLY:price_1ToFSpE1t2gQ3tvL5dFMvS9Y}
    max-annual: ${STRIPE_PRICE_MAX_ANNUAL:price_1ToFSqE1t2gQ3tvLckSxGH6Z}
    family-monthly-new: ${STRIPE_PRICE_FAMILY_MONTHLY_NEW:price_1ToFSrE1t2gQ3tvLVAcnyFER}
    family-annual: ${STRIPE_PRICE_FAMILY_ANNUAL:price_1ToFStE1t2gQ3tvLhqAVce75}
    # B2B tiers (per-class, human-close). Amounts now USD. Human-close only — admin
    # creates subscriptions in Stripe Dashboard; set quantity = number of classes for CENTRE.
    # SOLO:   $99/mo · $990/yr per org (1 class, quantity=1)
    # CENTRE: $149/class/mo · $1,490/class/yr (~17% discount, 2 months free)
    # School: custom — invoice manually, no Stripe Price needed
    solo-monthly:   ${STRIPE_PRICE_SOLO_MONTHLY:price_1ToFSuE1t2gQ3tvL8HwUO4td}
    solo-annual:    ${STRIPE_PRICE_SOLO_ANNUAL:price_1ToFSvE1t2gQ3tvLg9JJ4Lsw}
    centre-monthly: ${STRIPE_PRICE_CENTRE_MONTHLY:price_1ToFSxE1t2gQ3tvLMw4fdsBs}
    centre-annual:  ${STRIPE_PRICE_CENTRE_ANNUAL:price_1ToFSyE1t2gQ3tvL8Y1EqQ7V}

centre:
  closedbook:
    enabled: true
    relevance-threshold: 0.55
    refusal-template: "That's outside what {brand} covers in your materials. I can only answer from what your centre has uploaded. Ask your tutor, or try asking me about topics from your notes!"

pilot:
  purge:
    enabled: ${PILOT_PURGE_ENABLED:false}
    after-days: ${PILOT_PURGE_AFTER_DAYS:30}

b2b:
  pilot-days: ${PILOT_DAYS:30}
  class-cap-solo: ${CLASS_CAP_SOLO:15}
  class-cap-centre: ${CLASS_CAP_CENTRE:20}
  educator-terms-url: ${EDUCATOR_TERMS_URL:}

claude:
  api:
    key: ${CLAUDE_API_KEY:}
    base-url: https://api.anthropic.com
    model: claude-haiku-4-5-20251001
    # Model routing (see ModelRouter): Haiku is the default for everything.
    # Sonnet (claude.model.sonnet) is used ONLY for Max/Family complex chat.
    # Centre-sourced students are always forced to Haiku (chat AND vision).
    # Vision (photo questions) defaults to Haiku; CLAUDE_VISION_STANDARD/_HEAVY/_MAX
    # can override per visual difficulty, but those overrides are centre-guarded too.
    relevance-max-tokens: 128
    chat-max-tokens: 1024
    version: "2023-06-01"

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    # Fallback chain. NOTE: gemini-1.5-* AND gemini-2.0-flash are retired by
    # Google (confirmed 404 "no longer available" in prod) — use 2.5-family only.
    #   Tier 1: gemini-2.5-flash      → current, fast, 1M context (default primary)
    #   Tier 2: gemini-2.5-flash-lite → cheaper, current (default secondary)
    #   Tier 3: Claude Haiku (chunked) → always available, ~10x cost of Gemini
    # Override individual tiers via GEMINI_MODEL_PRIMARY / GEMINI_MODEL_SECONDARY.
    # Verify any model resolves for the live key: POST /api/v1/admin/smoke/gemini?model=<id>
    model:
      primary: ${GEMINI_MODEL_PRIMARY:gemini-2.5-flash}
      secondary: ${GEMINI_MODEL_SECONDARY:gemini-2.5-flash-lite}
    base-url: https://generativelanguage.googleapis.com
  # Per-purpose thinking budget (cost lever, GeminiThinkingBudgetConfig). A purpose
  # listed with 0 disables gemini-2.5-flash thinking (thinking tokens bill at the
  # output rate and, at low output caps, cause silent empties → Haiku fallback —
  # proven by FlashcardModelEvidenceGate). EXTRACTION / classify / structured-
  # generation purposes are listed → 0. The REASONING evals (teach-eval,
  # module-prove-eval) are deliberately ABSENT → provider default (thinking ON),
  # until the evidence gate proves a flip is safe (DEFERRED). Revert any single
  # purpose by removing its line (→ provider default). Keys are the purpose_label.
  thinking-budget:
    topic-router: 0
    summarizer: 0
    class-brief: 0
    wiki-compile: 0
    module-learn-gen: 0
    module-hottake-gen: 0
    module-spotmistake-gen: 0
    module-challenge-gen: 0
    module-prove-gen: 0
    centre-regen-learn: 0
    centre-regen-hottake: 0
    centre-regen-spotmistake: 0
    centre-regen-challenge: 0

# Storage defaults to s3 (Cloudflare R2) so production needs no per-deploy flag.
# Local dev / CI override via STORAGE_TYPE=local (tests force local in
# application-test.yml). If s3 is selected but the R2_* creds are blank, the
# S3Client bean is not registered (S3ClientConfig logs a warning) so the app
# still boots — it just can't serve files until creds are supplied.
storage:
  type: ${STORAGE_TYPE:s3}
  local:
    base-path: ${STORAGE_LOCAL_PATH:/tmp/pally}
  s3:
    bucket: ${S3_BUCKET:pally-files}
    region: ${S3_REGION:ap-southeast-1}
    endpoint: ${S3_ENDPOINT:}

logging:
  level:
    root: INFO
    com.pally: DEBUG
    com.pally.infrastructure.ai: DEBUG
    com.pally.shared.logging: DEBUG
    org.springframework.web: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.deprecation: WARN
    org.flywaydb: INFO
    io.netty.resolver.dns: ERROR
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{30} - %msg%n"

# Wiki-compile tuning (defaults live in @Value fallbacks; set here to override).
compile:
  # Files whose combined new text exceeds this compile ASYNC (batched + segmented).
  max-sync-chars: 50000
  # Hard upper bound on a SINGLE file's extracted text — above this even within-file
  # segmentation is impractical (~330 pages); the upload is rejected with a
  # "split by chapter" message. Set 0 to disable the ceiling.
  max-total-chars: 600000

flashcard:
  # Above this many wiki pages, flashcard auto-generate-on-open becomes an
  # explicit CTA (avoids the synchronous all-pages generation hang).
  auto-generate-max-pages: 15

subscription:
  free:
    # FREE (SPARK) tier: max ACCEPTED (compile-triggering) uploads per rolling
    # 30 days. The compile (~25c on Gemini) is the expensive op, so this caps the
    # cost tap on the free tier. Tune from data without a deploy. -1 = unlimited.
    upload-cap: 5
